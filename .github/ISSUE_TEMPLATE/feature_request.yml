name: 功能建议 / Feature request
description: 新协议、新命令或改进建议 / A new protocol, command or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        frm-node 只编排官方核心，不自行实现代理协议；README 中已列出计划支持的协议（TUIC v5、Shadowsocks 2022、NaiveProxy、证书型 VLESS/Trojan）。
        frm-node only orchestrates official cores and never implements proxy protocols itself. Planned protocols (TUIC v5, Shadowsocks 2022, NaiveProxy, certificate-based VLESS/Trojan) are listed in the README.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你想做什么，现在为什么做不到 / What you want to do and why it is not possible today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 期望的命令或行为；涉及新协议时请附官方服务端仓库链接 / The command or behaviour you expect; for a new protocol, link the official server implementation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 不要包含凭据或真实订阅地址 / Do not include credentials or real subscription URLs
